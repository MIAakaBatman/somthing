<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman Login</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fdf0f7 0%, #f7d9ea 100%);
        color: #3f2938;
        overflow: hidden;
      }

      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .star {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff3ff 0%, #ff99d1 30%, #ff4db8 60%);
        box-shadow: 0 0 12px rgba(255,77,184,0.9), 0 0 30px rgba(255,59,170,0.5);
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
        animation: twinkle 3s infinite ease-in-out;
        filter: drop-shadow(0 0 6px rgba(255,77,184,0.6));
      }

      @keyframes twinkle {
        0% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
      }

      .login-box {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 420px;
        padding: 40px 30px;
        background: rgba(255, 255, 255, 0.38);
        border: 1px solid rgba(255, 99, 170, 0.35);
        border-radius: 22px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 25px rgba(255, 87, 172, 0.25),
                    0 0 50px rgba(255, 87, 172, 0.12);
      }

      h1 {
        margin: 0 0 18px;
        text-align: center;
        color: #d72f7c;
        font-size: 2.2rem;
        letter-spacing: 2px;
        text-shadow: 0 0 12px rgba(255, 76, 178, 0.7);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 700;
        color: #6d2d52;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(232, 94, 168, 0.7);
        background: rgba(255, 255, 255, 0.45);
        color: #3b2434;
        font-size: 1rem;
        outline: none;
        transition: 0.2s ease;
      }

      input:focus {
        box-shadow: 0 0 0 3px rgba(255, 102, 180, 0.2),
                    0 0 12px rgba(255, 76, 178, 0.5);
        border-color: #ff4db8;
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff5cb8 0%, #ff2a88 100%);
        box-shadow: 0 0 12px rgba(255, 79, 177, 0.7),
                    0 0 30px rgba(255, 59, 170, 0.9);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 0 18px rgba(255, 79, 177, 0.9),
                    0 0 35px rgba(255, 59, 170, 1);
      }

      .message {
        margin-top: 14px;
        min-height: 22px;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .success {
        color: #138a42;
      }

      .error {
        color: #a01245;
      }

      .cursor-line {
        position: fixed;
        left: 0;
        top: 0;
        width: 160px;
        height: 3px;
        background: linear-gradient(90deg, rgba(255,115,185,0.0), rgba(255,58,160,0.95), rgba(255,115,185,0.0));
        border-radius: 2px;
        transform-origin: 0 50%;
        pointer-events: none;
        z-index: 3;
        filter: drop-shadow(0 0 8px rgba(255,77,184,0.7));
        transition: transform 0.08s linear;
        opacity: 0.9;
        mix-blend-mode: screen;
      }

      @media (max-width: 420px) {
        .star { width: 5px; height: 5px; }
        .cursor-line { width: 110px; }
        .login-box { padding: 28px 18px; }
        h1 { font-size: 1.6rem; }
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars"></div>

    <div class="login-box">
      <h1>LOGIN</h1>

      <form id="loginForm">
        <div>
          <label for="username">Name</label>
          <input id="username" type="text" placeholder="Enter your name" required />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn">LOGIN</button>
      </form>

      <div id="message" class="message"></div>
    </div>

    <div class="cursor-line" id="cursorLine" aria-hidden="true"></div>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username === 'BATMAN' && password === 'GOTHAM1234') {
          message.textContent = 'Login successful! Welcome back, Batman.';
          message.className = 'message success';
          form.reset();
        } else {
          message.textContent = 'Invalid name or password. Try again.';
          message.className = 'message error';
        }
      });

      (function createStars() {
        const starsContainer = document.getElementById('stars');
        const count = Math.max(Math.floor((window.innerWidth * window.innerHeight) / 60000), 12);

        for (let i = 0; i < count; i++) {
          const s = document.createElement('div');
          s.className = 'star';

          const x = Math.random() * 100;
          const y = Math.random() * 100;
          s.style.left = x + '%';
          s.style.top = y + '%';

          const size = 3 + Math.random() * 6;
          s.style.width = size + 'px';
          s.style.height = size + 'px';

          const dur = 2 + Math.random() * 3.5;
          const delay = Math.random() * 3;
          s.style.animationDuration = dur + 's';
          s.style.animationDelay = delay + 's';

          starsContainer.appendChild(s);
        }

        setInterval(() => {
          const all = starsContainer.children;
          for (let i = 0; i < all.length; i++) {
            const el = all[i];
            const dx = (Math.random() - 0.5) * 6;
            const dy = (Math.random() - 0.5) * 6;
            el.style.transform = `translate(${dx}px, ${dy}px)`;
          }
        }, 4000);
      })();

      (function cursorLine() {
        const line = document.getElementById('cursorLine');
        let last = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        window.addEventListener('mousemove', (e) => {
          const x = e.clientX;
          const y = e.clientY;

          const dx = x - last.x;
          const dy = y - last.y;
          const angle = Math.atan2(dy, dx) * (180 / Math.PI);

          const offset = 20;
          const px = x - Math.cos(angle * Math.PI / 180) * offset;
          const py = y - Math.sin(angle * Math.PI / 180) * offset;

          line.style.transform = `translate(${px}px, ${py}px) rotate(${angle}deg)`;

          const speed = Math.sqrt(dx*dx + dy*dy);
          const baseWidth = window.innerWidth < 420 ? 110 : 160;
          const width = Math.min(baseWidth + speed * 0.8, 360);
          line.style.width = width + 'px';

          last.x = x;
          last.y = y;
        });

        window.addEventListener('mouseleave', () => {
          line.style.opacity = '0';
        });
        window.addEventListener('mouseenter', () => {
          line.style.opacity = '0.9';
        });

        window.addEventListener('touchmove', (ev) => {
          if (!ev.touches || ev.touches.length === 0) return;
          const t = ev.touches[0];
          const e = { clientX: t.clientX, clientY: t.clientY };
          const move = new MouseEvent('mousemove', e);
          window.dispatchEvent(move);
        }, { passive: true });
      })();

      window.addEventListener('resize', () => {
        const container = document.getElementById('stars');
        while (container.firstChild) container.removeChild(container.firstChild);

        const count = Math.max(Math.floor((window.innerWidth * window.innerHeight) / 60000), 12);
        for (let i = 0; i < count; i++) {
          const s = document.createElement('div');
          s.className = 'star';
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          s.style.left = x + '%';
          s.style.top = y + '%';
          const size = 3 + Math.random() * 6;
          s.style.width = size + 'px';
          s.style.height = size + 'px';
          const dur = 2 + Math.random() * 3.5;
          const delay = Math.random() * 3;
          s.style.animationDuration = dur + 's';
          s.style.animationDelay = delay + 's';
          container.appendChild(s);
        }
      });
    </script>
  </body>
</html>
