<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman Login</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fdf0f7 0%, #f7d9ea 100%);
        color: #3f2938;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px;
      }

      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .star {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff3ff 0%, #ff99d1 30%, #ff4db8 60%);
        box-shadow: 0 0 12px rgba(255,77,184,0.9), 0 0 30px rgba(255,59,170,0.5);
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
        animation: twinkle 3s infinite ease-in-out;
        filter: drop-shadow(0 0 6px rgba(255,77,184,0.6));
      }

      @keyframes twinkle {
        0% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.6); }
      }

      .login-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 420px;
      }

      .pixel-cat {
        width: 80px;
        height: 80px;
        animation: catBlink 3s ease-in-out infinite;
        display: block;
      }

      @keyframes catBlink {
        0%, 10%, 20%, 100% { transform: scaleY(1); }
        5%, 15% { transform: scaleY(0.3); }
      }

      .login-box {
        position: relative;
        width: 100%;
        padding: 40px 30px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(255, 99, 170, 0.25);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 24px;
        text-align: center;
        color: #d72f7c;
        font-size: 2rem;
        letter-spacing: 2px;
        text-shadow: none;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 700;
        color: #6d2d52;
        margin-bottom: 6px;
        display: block;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 2px solid #e8a8d0;
        background: #fff;
        color: #3b2434;
        font-size: 1rem;
        outline: none;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #d72f7c;
        box-shadow: 0 0 0 3px rgba(215, 47, 124, 0.1);
      }

      input::placeholder {
        color: #b8959f;
      }

      .btn {
        border: none;
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0.7px;
        color: #ffffff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff00ff 0%, #ff10a5 35%, #ff4fd8 65%, #ff00ff 100%);
        box-shadow:
          0 0 8px rgba(255, 0, 255, 0.9),
          0 0 18px rgba(255, 0, 255, 0.9),
          0 0 32px rgba(255, 16, 165, 0.95),
          0 0 52px rgba(255, 79, 216, 1),
          inset 0 0 10px rgba(255,255,255,0.45);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        margin-top: 6px;
        filter: saturate(1.6) brightness(1.1);
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow:
          0 0 12px rgba(255, 0, 255, 1),
          0 0 24px rgba(255, 0, 255, 1),
          0 0 40px rgba(255, 16, 165, 1),
          0 0 70px rgba(255, 79, 216, 1),
          inset 0 0 12px rgba(255,255,255,0.5);
      }

      .btn:active {
        transform: translateY(0) scale(0.99);
      }

      .message {
        margin-top: 14px;
        min-height: 22px;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 8px;
        border-radius: 6px;
      }

      .success {
        color: #0a6b2f;
        background: rgba(10, 107, 47, 0.08);
      }

      .error {
        color: #a01245;
        background: rgba(160, 18, 69, 0.08);
      }

      canvas#cursorCanvas {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
        width: 100vw;
        height: 100vh;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .star { 
          width: 4px; 
          height: 4px; 
        }

        .login-box { 
          padding: 28px 18px; 
        }

        h1 { 
          font-size: 1.6rem; 
          margin-bottom: 18px;
        }

        .pixel-cat { 
          width: 64px; 
          height: 64px; 
        }

        input {
          padding: 10px 12px;
          font-size: 16px;
        }

        .btn {
          padding: 10px 16px;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars"></div>

    <div class="login-container">
      <svg class="pixel-cat" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-label="Pixel cat">
        <style>
          .cat-black { fill: #333; }
          .cat-pink { fill: #ffb3d9; }
          .cat-white { fill: #fff; }
          .cat-eye { fill: #000; }
        </style>
        <rect class="cat-black" x="20" y="30" width="40" height="35" rx="2"/>
        <polygon class="cat-black" points="20,30 15,15 25,25"/>
        <polygon class="cat-black" points="60,30 65,15 55,25"/>
        <circle class="cat-white" cx="30" cy="40" r="5"/>
        <circle class="cat-eye" cx="30" cy="40" r="3"/>
        <circle class="cat-white" cx="50" cy="40" r="5"/>
        <circle class="cat-eye" cx="50" cy="40" r="3"/>
        <polygon class="cat-pink" points="40,50 38,55 42,55"/>
        <path class="cat-black" d="M 40 55 Q 35 58 30 55" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path class="cat-black" d="M 40 55 Q 45 58 50 55" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect class="cat-black" x="25" y="65" width="30" height="12" rx="2"/>
      </svg>
      
      <div class="login-box">
        <h1>LOGIN</h1>

        <form id="loginForm">
          <div>
            <label for="username">Name</label>
            <input id="username" type="text" placeholder="Enter your name" required />
          </div>

          <div>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn">LOGIN</button>
        </form>

        <div id="message" class="message" aria-live="polite" aria-atomic="true"></div>
      </div>
    </div>

    <canvas id="cursorCanvas" aria-hidden="true"></canvas>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');
      let starInterval = null;

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim().toUpperCase();
        const password = document.getElementById('password').value.trim();

        if (username === 'BATMAN' && password === 'GOTHAM123') {
          message.textContent = 'Login successful! Welcome back, Batman.';
          message.classList.remove('error');
          message.classList.add('success');
          form.reset();
        } else {
          message.textContent = 'Invalid name or password. Try again.';
          message.classList.remove('success');
          message.classList.add('error');
        }
      });

      function createStars() {
        const starsContainer = document.getElementById('stars');
        starsContainer.innerHTML = '';
        
        const count = Math.max(Math.floor((window.innerWidth * window.innerHeight) / 60000), 8);

        for (let i = 0; i < count; i++) {
          const s = document.createElement('div');
          s.className = 'star';

          const x = Math.random() * 100;
          const y = Math.random() * 100;
          s.style.left = x + '%';
          s.style.top = y + '%';

          const size = 3 + Math.random() * 5;
          s.style.width = size + 'px';
          s.style.height = size + 'px';

          const dur = 2.5 + Math.random() * 3;
          const delay = Math.random() * 2;
          s.style.animationDuration = dur + 's';
          s.style.animationDelay = delay + 's';

          starsContainer.appendChild(s);
        }

        if (starInterval) clearInterval(starInterval);

        starInterval = setInterval(() => {
          const all = starsContainer.children;
          for (let i = 0; i < all.length; i++) {
            const el = all[i];
            const dx = (Math.random() - 0.5) * 3;
            const dy = (Math.random() - 0.5) * 3;
            el.style.transform = `translate(${dx}px, ${dy}px)`;
          }
        }, 5000);
      }

      createStars();

      (function cursorTrail() {
        const canvas = document.getElementById('cursorCanvas');
        if (!canvas.getContext) return;
        
        const ctx = canvas.getContext('2d');
        const trail = [];
        const maxTrailLength = 25;
        const fadeOutTime = 600;
        let isDrawing = false;

        function resizeCanvas() {
          canvas.width = window.innerWidth * window.devicePixelRatio;
          canvas.height = window.innerHeight * window.devicePixelRatio;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }

        resizeCanvas();

        function addPoint(x, y) {
          trail.push({ x, y, createdAt: performance.now() });
          if (trail.length > maxTrailLength) trail.shift();
          isDrawing = true;
        }

        function draw() {
          const now = performance.now();
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          for (let i = 1; i < trail.length; i++) {
            const prev = trail[i - 1];
            const curr = trail[i];
            const age = (now - curr.createdAt) / fadeOutTime;
            const opacity = Math.max(0, 1 - age);

            if (opacity <= 0) continue;

            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(curr.x, curr.y);
            ctx.strokeStyle = `rgba(0, 150, 255, ${opacity * 0.9})`;
            ctx.lineWidth = 2 + opacity * 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = `rgba(0, 150, 255, ${opacity * 0.8})`;
            ctx.shadowBlur = 10;
            ctx.stroke();
          }

          ctx.shadowBlur = 0;

          for (let i = trail.length - 1; i >= 0; i--) {
            const point = trail[i];
            const age = (now - point.createdAt) / fadeOutTime;
            const opacity = Math.max(0, 1 - age);

            if (opacity <= 0) {
              trail.splice(i, 1);
            }
          }

          if (isDrawing) {
            requestAnimationFrame(draw);
          }
        }

        window.addEventListener('mousemove', (e) => {
          addPoint(e.clientX, e.clientY);
          if (!isDrawing) draw();
        });

        window.addEventListener('touchmove', (ev) => {
          if (!ev.touches || ev.touches.length === 0) return;
          const t = ev.touches[0];
          addPoint(t.clientX, t.clientY);
          if (!isDrawing) draw();
        }, { passive: true });

        window.addEventListener('mouseleave', () => {
          trail.length = 0;
          isDrawing = false;
        });

        window.addEventListener('resize', resizeCanvas);
      })();

      window.addEventListener('resize', createStars);
    </script>
  </body>
</html>
